name: CD

# Deploy only after CI succeeds on main (not in parallel with CI).
# Manual "Run workflow" still allowed via workflow_dispatch.
on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    # PRs also run CI — never deploy those. Only successful CI after a push to main.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      )

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2

      - name: Decide whether to deploy
        id: gate
        run: |
          set -e
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch — deploy"
            exit 0
          fi
          # Keep previous path filter: only deploy when server (or this workflow) changed
          if git diff --name-only HEAD^ HEAD | grep -E '^(server/|\.github/workflows/cd\.yml)'; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "Server/CD changes detected — deploy"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "No server/CD changes — skip deploy"
          fi

      - name: Deploy backend API
        if: steps.gate.outputs.deploy == 'true'
        uses: appleboy/ssh-action@v1.0.3
        env:
          GH_USERNAME: ${{ secrets.GH_USERNAME }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GH_USERNAME,GH_TOKEN
          script: |
            set -e

            cd /opt/saasDelivery/server

            echo "→ Backing up .env before pull..."
            if [ -f wwebjs-bot/.env ]; then
              cp wwebjs-bot/.env /tmp/livsight-server.env
            elif [ -f server/.env ]; then
              cp server/.env /tmp/livsight-server.env
            fi

            echo "→ Pulling latest code..."
            git remote set-url origin https://${GH_USERNAME}:${GH_TOKEN}@github.com/Ericdt17/saasDelivery.git
            git fetch origin main
            git reset --hard origin/main

            echo "→ Restoring .env if missing..."
            if [ ! -f server/.env ] && [ -f /tmp/livsight-server.env ]; then
              cp /tmp/livsight-server.env server/.env
              chmod 600 server/.env
            fi

            if [ ! -f server/.env ]; then
              echo "ERROR: server/.env missing — restore DATABASE_URL and secrets on VPS"
              exit 1
            fi
            cp server/.env /tmp/livsight-server.env
            chmod 600 /tmp/livsight-server.env

            echo "→ Installing dependencies..."
            cd server
            npm install --omit=dev

            echo "→ Running migrations..."
            npm run migrate

            echo "→ Restarting API server..."
            export DEPLOY_GIT_SHA=$(git -C /opt/saasDelivery/server rev-parse --short HEAD)
            pm2 delete api-server 2>/dev/null || true
            pm2 start ecosystem.config.js
            pm2 save

            echo "→ Verifying service..."
            for i in $(seq 1 20); do
              if curl -fsS "http://127.0.0.1:3001/api/v1/health" > /tmp/health.json; then
                cat /tmp/health.json
                pm2 list | grep api-server
                echo "✓ Deploy complete"
                exit 0
              fi
              sleep 1
            done
            echo "API health endpoint did not become ready in time"
            pm2 logs api-server --lines 30 --nostream || true
            exit 1
